[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-lib"
version = "0.1.0"
description = "Shared constants, verified electrostatics/lifetime models, circuit-diagram building blocks, and SVG minification pipeline for the Semiconductor Notes knowledge base."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "schemdraw",
]

[project.optional-dependencies]
figures = ["scour"]            # SVG minification (plotting.py, figures.py)
test = ["pytest", "scour"]

[tool.setuptools.packages.find]
include = ["semiconductor_lib*"]
